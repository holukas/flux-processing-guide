<!--
  Relocates Quarto's light/dark theme toggle out of the left sidebar title into
  the top of the right ("On this page") sidebar. Quarto has no option to place
  the toggle there, so we move the node client-side on load. On pages without a
  TOC (no right sidebar) the toggle is left where Quarto put it. Styling is in
  styles.css (.margin-theme-toggle, .quarto-color-scheme-toggle). Wired in via
  docs/_quarto.yml -> format.html.include-after-body.
-->
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var tools = document.querySelector(
      "#quarto-sidebar .sidebar-title .sidebar-tools-main"
    );
    var right = document.getElementById("quarto-margin-sidebar");
    if (!tools || !right) return;
    var holder = document.createElement("div");
    // `sidebar-navigation` makes Quarto's own (theme-aware) sun/moon icon rules
    // match the toggle here in the right sidebar -- they're scoped to that class
    // and would otherwise leave an empty icon box. styles.css neutralizes the
    // stray padding that class brings.
    holder.className = "margin-theme-toggle sidebar-navigation";
    holder.appendChild(tools); // move the node (the toggle lives inside)
    right.insertBefore(holder, right.firstChild);
  });
</script>
