<svg xmlns="http://www.w3.org/2000/svg" class="fpg-chart" viewBox="0 0 900 1298" role="img" aria-labelledby="ttl dsc" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <style>
  /* Standalone (Obsidian, image): follow the system setting. Inside the Quarto
     site: follow the site's light/dark toggle (body.quarto-light/-dark), which
     outranks the media query. All rules are scoped to the chart so they do not
     reach the page when the SVG is placed inline. */
  svg.fpg-chart {
    --bg: #f7f7f4;
    --ink: #1f2933;
    --muted: #5f6b76;
    --line: #6b7785;
    --ec-lane: #e5f3ef;
    --ec-fill: #c9ebe1;
    --ec-stroke: #0f766e;
    --met-lane: #eceefb;
    --met-fill: #d8dcf7;
    --met-stroke: #4338ca;
    --data-fill: #ffffff;
    --data-stroke: #9aa6b2;
    --core-fill: #fdebc4;
    --core-stroke: #b45309;
    --fr-fill: #fcd9d4;
    --fr-stroke: #b42318;
    --canvas: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    svg.fpg-chart {
    --bg: #15171c;
    --ink: #e6e8eb;
    --muted: #9aa5b1;
    --line: #8b95a3;
    --ec-lane: #122b27;
    --ec-fill: #1c4a40;
    --ec-stroke: #5eead4;
    --met-lane: #1a1e3a;
    --met-fill: #2b3270;
    --met-stroke: #a5b4fc;
    --data-fill: #1e2228;
    --data-stroke: #5b6573;
    --core-fill: #4a3712;
    --core-stroke: #fbbf24;
    --fr-fill: #4d1f1b;
    --fr-stroke: #fda29b;
    }
  }
  body.quarto-light svg.fpg-chart {
    --bg: #f7f7f4;
    --ink: #1f2933;
    --muted: #5f6b76;
    --line: #6b7785;
    --ec-lane: #e5f3ef;
    --ec-fill: #c9ebe1;
    --ec-stroke: #0f766e;
    --met-lane: #eceefb;
    --met-fill: #d8dcf7;
    --met-stroke: #4338ca;
    --data-fill: #ffffff;
    --data-stroke: #9aa6b2;
    --core-fill: #fdebc4;
    --core-stroke: #b45309;
    --fr-fill: #fcd9d4;
    --fr-stroke: #b42318;
    --canvas: transparent;
  }
  body.quarto-dark svg.fpg-chart {
    --bg: #15171c;
    --ink: #e6e8eb;
    --muted: #9aa5b1;
    --line: #8b95a3;
    --ec-lane: #122b27;
    --ec-fill: #1c4a40;
    --ec-stroke: #5eead4;
    --met-lane: #1a1e3a;
    --met-fill: #2b3270;
    --met-stroke: #a5b4fc;
    --data-fill: #1e2228;
    --data-stroke: #5b6573;
    --core-fill: #4a3712;
    --core-stroke: #fbbf24;
    --fr-fill: #4d1f1b;
    --fr-stroke: #fda29b;
    --canvas: transparent;
  }
  svg.fpg-chart .lane-label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  svg.fpg-chart .t { font-size: 15px; font-weight: 600; text-anchor: middle; }
  svg.fpg-chart .s { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
  svg.fpg-chart .edge { fill: none; stroke: var(--line); stroke-width: 1.8; }
  svg.fpg-chart .edge-label { font-size: 12.5px; fill: var(--muted); text-anchor: middle; font-style: italic; }
  svg.fpg-chart .data { fill: var(--data-fill); stroke: var(--data-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.fpg-chart .ec { fill: var(--ec-fill); stroke: var(--ec-stroke); stroke-width: 1.5; }
  svg.fpg-chart .met { fill: var(--met-fill); stroke: var(--met-stroke); stroke-width: 1.5; }
  svg.fpg-chart .core { fill: var(--core-fill); stroke: var(--core-stroke); stroke-width: 1.8; }
  svg.fpg-chart .fr { fill: var(--fr-fill); stroke: var(--fr-stroke); stroke-width: 1.5; }
  svg.fpg-chart .fr-data { fill: var(--data-fill); stroke: var(--fr-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.fpg-chart .db { fill: var(--data-fill); stroke: var(--met-stroke); stroke-width: 1.5; }
  svg.fpg-chart .levels rect { fill: var(--data-fill); stroke: var(--core-stroke); stroke-width: 1; stroke-opacity: 0.5; }
  svg.fpg-chart .levels .lv { font-size: 12.5px; font-weight: 700; fill: var(--core-stroke); }
  svg.fpg-chart .levels .ln { font-size: 13.5px; }
  svg.fpg-chart .levels .lnote { font-size: 11.5px; fill: var(--muted); }
  svg.fpg-chart .badges circle { fill: var(--ink); }
  svg.fpg-chart .badges text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
  svg.fpg-chart text { fill: var(--ink); }
  svg.fpg-chart .h1 { font-size: 26px; font-weight: 600; }
  svg.fpg-chart .sub { font-size: 15px; fill: var(--muted); }
  svg.fpg-chart .lg { font-size: 13px; fill: var(--muted); }
  </style>
    <title id="ttl">Flux processing chain</title>
    <desc id="dsc">Eddy covariance raw data from sonicread are converted by bico; raw data from rECord need no conversion. A Level-0 run of fluxrun and EddyPro gives Level-0 fluxes, which are used to refine the settings, for example the time lag, of the final Level-1 run. The Level-1 run uses the same raw data and the screened meteo data. Meteo logger files are uploaded to InfluxDB by dataflow, screened with diive and stored in the processed bucket. The Level-1 fluxes and the screened meteo data go to the diive flux processing chain: L2 quality flag expansion, L3.1 storage correction, L3.2 outlier flagging, L3.3 USTAR threshold detection on nighttime NEE that passed the checks so far, L3.4 overall quality flag QCF, L4.1 gap-filling and L4.2 partitioning of NEE and ET, which produce quality-controlled, gap-filled fluxes.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
      </marker>
    </defs>
    <rect width="900" height="1298" fill="var(--canvas)"/>
    <text class="h1" x="20" y="40">Flux processing chain</text>
    <text class="sub" x="20" y="64">From raw eddy covariance and meteo data to quality-controlled fluxes</text>
    <g class="legend">
      <rect class="data" x="20" y="82" width="22" height="14" rx="4"/><text class="lg" x="50" y="94">Data files</text>
      <rect class="ec" x="134" y="82" width="22" height="14" rx="4"/><text class="lg" x="164" y="94">bico</text>
      <rect class="fr" x="216" y="82" width="22" height="14" rx="4"/><text class="lg" x="246" y="94">fluxrun + EddyPro</text>
      <rect class="met" x="384" y="82" width="22" height="14" rx="4"/><text class="lg" x="414" y="94">dataflow and database</text>
      <rect class="core" x="578" y="82" width="22" height="14" rx="4"/><text class="lg" x="608" y="94">diive</text>
    </g>
    <g transform="translate(0 110)">

    <!-- lanes -->
    <rect x="20" y="50" width="500" height="662" rx="16" fill="var(--ec-lane)"/>
    <text class="lane-label" x="40" y="80" style="fill: var(--ec-stroke)">Eddy covariance</text>
    <rect x="560" y="50" width="320" height="662" rx="16" fill="var(--met-lane)"/>
    <text class="lane-label" x="580" y="80" style="fill: var(--met-stroke)">Meteo</text>

    <!-- edges: eddy covariance -->
    <path class="edge" d="M140,164 V208" marker-end="url(#arrow)"/>
    <path class="edge" d="M140,274 V302 H230 V328" marker-end="url(#arrow)"/>
    <path class="edge" d="M400,164 V302 H310 V328" marker-end="url(#arrow)"/>
    <path class="edge" d="M140,302 H64 V562 H168" marker-end="url(#arrow)"/>
    <text class="edge-label" transform="rotate(-90 52 440)" x="52" y="440">same raw data</text>
    <path class="edge" d="M270,394 V428" marker-end="url(#arrow)"/>
    <path class="edge" d="M270,494 V528" marker-end="url(#arrow)"/>
    <text class="edge-label" x="282" y="515" style="text-anchor: start">refined settings, e.g. time lag</text>
    <path class="edge" d="M270,594 V628" marker-end="url(#arrow)"/>

    <!-- edges: meteo -->
    <path class="edge" d="M720,164 V208" marker-end="url(#arrow)"/>
    <path class="edge" d="M720,274 V326" marker-end="url(#arrow)"/>
    <path class="edge" d="M720,394 V428" marker-end="url(#arrow)"/>
    <path class="edge" d="M720,494 V526" marker-end="url(#arrow)"/>
    <path class="edge" d="M620,562 H372" marker-end="url(#arrow)"/>
    <text class="edge-label" x="495" y="554">meteo data</text>

    <!-- edges: to diive and result -->
    <path class="edge" d="M270,694 V732 H415 V758" marker-end="url(#arrow)"/>
    <path class="edge" d="M720,594 V732 H485 V758" marker-end="url(#arrow)"/>
    <text class="edge-label" x="610" y="724">drivers</text>
    <path class="edge" d="M450,1066 V1102" marker-end="url(#arrow)"/>

    <!-- eddy covariance -->
    <rect class="data" x="40" y="100" width="200" height="64" rx="10"/>
    <text class="t" x="140" y="128">Raw binary files</text>
    <text class="s" x="140" y="147">sonicread · 10/20 Hz</text>

    <rect class="data" x="300" y="100" width="200" height="64" rx="10"/>
    <text class="t" x="400" y="128">Raw CSV files</text>
    <text class="s" x="400" y="147">rECord · 20 Hz TOA5</text>

    <rect class="ec" x="40" y="210" width="200" height="64" rx="10"/>
    <text class="t" x="140" y="238">bico</text>
    <text class="s" x="140" y="257">binary to ASCII</text>

    <rect class="fr" x="170" y="330" width="200" height="64" rx="10"/>
    <text class="t" x="270" y="358">Level-0 run</text>
    <text class="s" x="270" y="377">fluxrun + EddyPro</text>

    <rect class="fr-data" x="170" y="430" width="200" height="64" rx="10"/>
    <text class="t" x="270" y="458">Level-0 fluxes</text>
    <text class="s" x="270" y="477">preliminary</text>

    <rect class="fr" x="170" y="530" width="200" height="64" rx="10"/>
    <text class="t" x="270" y="558">Level-1 run</text>
    <text class="s" x="270" y="577">fluxrun + EddyPro, final</text>

    <rect class="fr-data" x="170" y="630" width="200" height="64" rx="10"/>
    <text class="t" x="270" y="658">Level-1 fluxes</text>
    <text class="s" x="270" y="677">EddyPro output, 30 min</text>

    <!-- meteo -->
    <rect class="data" x="620" y="100" width="200" height="64" rx="10"/>
    <text class="t" x="720" y="128">Logger files</text>
    <text class="s" x="720" y="147">meteo stations</text>

    <rect class="met" x="620" y="210" width="200" height="64" rx="10"/>
    <text class="t" x="720" y="238">dataflow</text>
    <text class="s" x="720" y="257">upload to database</text>

    <path class="db" d="M620,338 V386 A100,8 0 0,0 820,386 V338"/>
    <ellipse class="db" cx="720" cy="338" rx="100" ry="8"/>
    <text class="t" x="720" y="366">InfluxDB</text>
    <text class="s" x="720" y="384">raw bucket</text>

    <rect class="core" x="620" y="430" width="200" height="64" rx="10"/>
    <text class="t" x="720" y="458">Meteo screening</text>
    <text class="s" x="720" y="477">diive</text>

    <path class="db" d="M620,538 V586 A100,8 0 0,0 820,586 V538"/>
    <ellipse class="db" cx="720" cy="538" rx="100" ry="8"/>
    <text class="t" x="720" y="566">InfluxDB</text>
    <text class="s" x="720" y="584">processed bucket</text>

    <!-- diive and result -->
    <rect class="core" x="250" y="760" width="400" height="306" rx="12"/>
    <text class="t" x="450" y="790">diive flux processing chain</text>
    <g class="levels">
      <rect x="270" y="806" width="360" height="28" rx="6"/><text class="lv" x="286" y="825">L2</text><text class="ln" x="336" y="825">Quality flag expansion</text>
      <rect x="270" y="840" width="360" height="28" rx="6"/><text class="lv" x="286" y="859">L3.1</text><text class="ln" x="336" y="859">Storage correction</text>
      <rect x="270" y="874" width="360" height="28" rx="6"/><text class="lv" x="286" y="893">L3.2</text><text class="ln" x="336" y="893">Outlier flagging</text>
      <rect x="270" y="908" width="360" height="42" rx="6"/><text class="lv" x="286" y="927">L3.3</text><text class="ln" x="336" y="927">USTAR threshold detection</text><text class="lnote" x="336" y="942">on nighttime NEE that passed the checks so far</text>
      <rect x="270" y="956" width="360" height="28" rx="6"/><text class="lv" x="286" y="975">L3.4</text><text class="ln" x="336" y="975">Overall quality flag QCF</text>
      <rect x="270" y="990" width="360" height="28" rx="6"/><text class="lv" x="286" y="1009">L4.1</text><text class="ln" x="336" y="1009">Gap-filling</text>
      <rect x="270" y="1024" width="360" height="28" rx="6"/><text class="lv" x="286" y="1043">L4.2</text><text class="ln" x="336" y="1043">Partitioning (NEE and ET)</text>
    </g>

    <rect class="data" x="325" y="1104" width="250" height="64" rx="10"/>
    <text class="t" x="450" y="1132">Quality-controlled fluxes</text>
    <text class="s" x="450" y="1151">gap-filled, partitioned</text>

    <!-- element numbers -->
    <g class="badges">
      <circle cx="40" cy="100" r="11"/><text x="40" y="104">1</text>
      <circle cx="300" cy="100" r="11"/><text x="300" y="104">2</text>
      <circle cx="40" cy="210" r="11"/><text x="40" y="214">3</text>
      <circle cx="170" cy="330" r="11"/><text x="170" y="334">4</text>
      <circle cx="170" cy="430" r="11"/><text x="170" y="434">5</text>
      <circle cx="170" cy="530" r="11"/><text x="170" y="534">6</text>
      <circle cx="170" cy="630" r="11"/><text x="170" y="634">7</text>
      <circle cx="620" cy="100" r="11"/><text x="620" y="104">8</text>
      <circle cx="620" cy="210" r="11"/><text x="620" y="214">9</text>
      <circle cx="620" cy="330" r="11"/><text x="620" y="334">10</text>
      <circle cx="620" cy="430" r="11"/><text x="620" y="434">11</text>
      <circle cx="620" cy="530" r="11"/><text x="620" y="534">12</text>
      <circle cx="250" cy="760" r="11"/><text x="250" y="764">13</text>
      <circle cx="325" cy="1104" r="11"/><text x="325" y="1108">14</text>
    </g>
    </g>
</svg>
