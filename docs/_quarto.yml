project:
  type: website
  output-dir: _build/html
  # The chart is placed inline, so Quarto would not copy the SVG; the
  # "Open image" button links to it.
  resources:
    - images/

# "Last updated" date on every page, moved into the right sidebar by
# _last-modified-sidebar.html. Uses the file's modification time.
date-modified: last-modified
date-format: "D MMMM YYYY"

website:
  title: "Flux Processing Guide"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  repo-url: https://github.com/holukas/flux-processing-guide
  repo-actions: [source, issue]
  page-footer: "Lukas Hörtnagl · [Grassland Sciences group, ETH Zurich](https://gl.ethz.ch/) · © 2026"
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - index.md
      # Sections follow the lanes of the chart: eddy covariance, meteo,
      # management, the diive flux processing chain, the flux product.
      - section: "Eddy covariance"
        contents:
          - Raw_Data_Logging.md
          - L0.md
          - L1.md
      - section: "Meteo"
        contents:
          - Meteo_Logging.md
          - Meteo_Screening.md
          - Meteo_For_EddyPro.md
          - Meteo_For_Dataset.md
      - Management_Data.md
      - section: Flux_Post_Processing_Chain.md
        contents:
          - L2.md
          - L3.1.md
          - L3.2.md
          - L3.3.md
          - text: "L3.4 · QCF"
            href: QCF.md
          - L4.1.md
          - L4.2.md
      - Flux_Product.md
      - section: "Reference"
        contents:
          - Conventions.md
          - Sharing_FLUXNET.md
          - data/Raw_and_Processed.md
          - data/Raw_Data_EC.md
          - data/Raw_Data_EC_rECord.md
          - Abbreviations.md
      - section: "Scripts"
        contents:
          - scripts/sonicread.md
          - scripts/rECord.md
          - scripts/bico.md
          - scripts/fluxrun.md
          - scripts/dataflow.md
          - scripts/diive.md
      - text: Repository
        href: https://github.com/holukas/flux-processing-guide

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    # Click an image to open it enlarged.
    lightbox: auto
    include-after-body:
      - _last-modified-sidebar.html
      - _theme-toggle.html
      - _chart-zoom.html
