<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flux Processing Guide">
<!-- Four arcs of a ring, cold to warm clockwise from the top, the colours of the fluxatlas
     ramps. The first arc is the only one that has to follow the theme: its dark blue disappears
     on the dark theme. Reading it through var() lets the inlined copy in _logo-sidebar.html take
     the page's value, while this standalone file, which is also the favicon, falls back to the
     light one. -->
<path d="M34.3 10.12 A22 22 0 0 1 53.88 29.7" fill="none" stroke="var(--fpg-logo-c1, #184f95)" stroke-width="10"/>
<path d="M53.88 34.3 A22 22 0 0 1 34.3 53.88" fill="none" stroke="#6da7ec" stroke-width="10"/>
<path d="M29.7 53.88 A22 22 0 0 1 10.12 34.3" fill="none" stroke="#ee9060" stroke-width="10"/>
<path d="M10.12 29.7 A22 22 0 0 1 29.7 10.12" fill="none" stroke="#dd5f2c" stroke-width="10"/>
</svg>
